apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-prod
resources:
  - ../../base
images:
  - name: ghcr.io/mo2mengoda/demo-api
    newTag: sha-0000000   # promoted from staging through a reviewed pull request
patches:
  - target: { kind: Ingress, name: demo-api }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: demo-api.lab.local
  - target: { kind: HorizontalPodAutoscaler, name: demo-api }
    patch: |
      - op: replace
        path: /spec/minReplicas
        value: 3
      - op: replace
        path: /spec/maxReplicas
        value: 10
  - target: { kind: PodDisruptionBudget, name: demo-api }
    patch: |
      - op: replace
        path: /spec/minAvailable
        value: 2
  - target: { kind: Deployment, name: demo-api }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/template/spec/containers/0/resources
        value:
          requests: { cpu: 250m, memory: 256Mi }
          limits: { memory: 512Mi }
      - op: replace
        path: /spec/topologySpreadConstraints/0/whenUnsatisfiable
        value: DoNotSchedule
