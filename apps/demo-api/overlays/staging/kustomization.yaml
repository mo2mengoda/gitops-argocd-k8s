apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-staging
resources:
  - ../../base
images:
  - name: ghcr.io/mo2mengoda/demo-api
    newTag: sha-0000000   # updated automatically by CI on every merge to main
patches:
  - target: { kind: Ingress, name: demo-api }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: demo-api.staging.lab.local
  - target: { kind: ConfigMap, name: demo-api-config }
    patch: |
      - op: replace
        path: /data/LOG_LEVEL
        value: debug
