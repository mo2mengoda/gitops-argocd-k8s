# "App of apps": the only thing applied by hand.
#   kubectl apply -n argocd -f argocd/project.yaml -f argocd/root-app.yaml
# Argo CD then creates and keeps in sync every Application under argocd/apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform
  source:
    repoURL: https://github.com/mo2mengoda/gitops-argocd-k8s.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
