# CI: test -> build -> push image -> bump the staging tag in Git.
# Argo CD notices the commit and rolls staging forward. No kubectl from CI,
# the cluster pulls its desired state from Git (GitOps).
name: ci

on:
  push:
    branches: [main]
    paths: ["src/**"]
  pull_request:
    paths: ["src/**"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/demo-api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r src/requirements.txt -r src/requirements-dev.txt
      - run: pytest -q src/tests

  build-and-bump:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tag
        id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: src
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}

      - name: Scan image (fail on critical CVEs)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - uses: imranismail/setup-kustomize@v2

      - name: Bump staging image tag
        run: |
          cd apps/demo-api/overlays/staging
          kustomize edit set image ${IMAGE}:${{ steps.meta.outputs.tag }}
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "staging: demo-api -> ${{ steps.meta.outputs.tag }}"
          git push
